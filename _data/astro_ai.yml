# Notebooks shown on the "AI applied to astrophysics" project page (_projects/astro_ai.md).
# Edit text here; order of sections and notebooks is preserved.
- name: "Probability & Monte Carlo methods"
  description: "Simulating randomness to answer questions that are hard to solve with pen and paper."
  notebooks:
    - title: "The Monty Hall problem"
      lecture: "L02"
      url: "https://github.com/MatthewMaisano/Astrostatistics-Laboratory/blob/main/lectures/Executives/Problema%20delle%203%20porte%20%28L02%29.ipynb"
      img: "assets/img/astro-ai/monty-hall.png"
      tags: ["Simulation", "Probability"]
      what: "Simulated 1,000 rounds of the famous game-show puzzle (three doors, one prize) for three strategies: keep the first door, switch, or pick again at random."
      result: "Switching wins 2/3 of the time, staying only 1/3, a random re-pick 1/2 — the simulation confirms the counter-intuitive answer."
      extra:
        - title: "100-door variant"
          url: "https://github.com/MatthewMaisano/Astrostatistics-Laboratory/blob/main/lectures/Executives/Problema%2098%20porte%20%28L02%29.ipynb"
    - title: "Monte Carlo integration"
      lecture: "L03"
      url: "https://github.com/MatthewMaisano/Astrostatistics-Laboratory/blob/main/lectures/Executives/Montecarlo%20Integration%20%28L03%29.ipynb"
      img: "assets/img/astro-ai/montecarlo.png"
      tags: ["Monte Carlo", "Integration"]
      what: "Computed an integral by averaging random draws from a Gaussian instead of solving it analytically, and studied how the error shrinks as the number of draws grows."
      result: "The estimates cluster around the exact value (2σ⁴ = 0.125) and their scatter falls steadily with more samples, as Monte Carlo theory predicts."
    - title: "Cloning quasars"
      lecture: "L04"
      url: "https://github.com/MatthewMaisano/Astrostatistics-Laboratory/blob/main/lectures/Executives/Cloning%20Quasars%20%28L04%29.ipynb"
      img: "assets/img/astro-ai/cloning-quasars.png"
      tags: ["Sampling", "SDSS data"]
      what: "Took the redshifts of 10,000 real quasars from the Sloan Digital Sky Survey and generated 100,000 synthetic “clones” with two techniques: rejection sampling and inverse-CDF sampling."
      result: "Both methods reproduce the shape of the real redshift distribution — a way to create realistic fake catalogues from any measured distribution."
    - title: "Volume of an N-dimensional sphere"
      lecture: "Extra"
      url: "https://github.com/MatthewMaisano/Astrostatistics-Laboratory/blob/main/lectures/Executives/Volume%20of%20an%20N-dimensional%20sphere.ipynb"
      img: "assets/img/astro-ai/nsphere.png"
      tags: ["Monte Carlo", "Curse of dimensionality"]
      what: "Threw random points into a cube in 1 to 20 dimensions and counted how many land inside the sphere that fits in it."
      result: "The fraction drops from 78% in 2D to essentially zero above ~12 dimensions: in high dimensions almost all the volume sits in the “corners” — the curse of dimensionality that makes machine learning on many features hard."
- name: "Statistical inference"
  description: "Extracting physical parameters \u2014 and their uncertainties \u2014 from noisy measurements."
  notebooks:
    - title: "Maximum likelihood on noisy data"
      lecture: "L05"
      url: "https://github.com/MatthewMaisano/Astrostatistics-Laboratory/blob/main/lectures/Executives/Likelyhood%20Quasars%20%28L05%29.ipynb"
      img: "assets/img/astro-ai/likelihood.png"
      tags: ["Maximum likelihood", "Fisher matrix"]
      what: "Combined 100 measurements of the same quantity, each with a different error bar (heteroscedastic data), by multiplying their likelihoods."
      result: "Best estimate μ = 0.985 ± 0.017 (true value 1), with the uncertainty obtained from the curvature of the log-likelihood (Fisher information)."
    - title: "How many black-hole populations?"
      lecture: "L06"
      url: "https://github.com/MatthewMaisano/Astrostatistics-Laboratory/blob/main/lectures/Executives/Black%20Holes%20Modes%20%28L06%29.ipynb"
      img: "assets/img/astro-ai/bh-modes.png"
      tags: ["Gaussian mixtures", "Model selection"]
      what: "Fitted the mass distribution of a simulated black-hole catalogue with a mixture of 1 to 10 Gaussians, using the Akaike Information Criterion (AIC) to choose the number of components; also estimated the density with a cross-validated kernel density estimator."
      result: "The AIC is minimised with 3 components: the data are best explained by three distinct formation channels."
    - title: "Black-hole irreducible mass"
      lecture: "L07"
      url: "https://github.com/MatthewMaisano/Astrostatistics-Laboratory/blob/main/lectures/Executives/Black%20Hole%20Mass%20%28L07%29.ipynb"
      img: "assets/img/astro-ai/bh-mass.png"
      tags: ["Histograms & KDE", "KS test"]
      what: "Computed the “irreducible mass” of spinning black holes (the part of the mass that can never be extracted) for random spins, compared histogram rules (equal-count bins, Freedman–Diaconis) and kernel density estimates, and used the Kolmogorov–Smirnov test to see which ingredient dominates the result."
      result: "When the mass spread is small the spin shapes the distribution; as the spread grows the irreducible mass simply follows the mass distribution (KS distance → 0)."
- name: "Bayesian inference & MCMC"
  description: "Letting the data update our beliefs, and exploring parameter space with Markov chains."
  notebooks:
    - title: "Markov chains: weather and stock market"
      lecture: "L10"
      url: "https://github.com/MatthewMaisano/Astrostatistics-Laboratory/blob/main/lectures/Executives/Weather%20forecast%20%2B%20Stock%20market%20%28L10%29.ipynb"
      img: "assets/img/astro-ai/markov.png"
      tags: ["Markov chains"]
      what: "Simulated two Markov chains: a two-state weather model (clear/cloudy) and a three-state stock market (bull/bear/stagnant), tracking how often each state occurs."
      result: "Both converge to their stationary distribution: 83% clear days; 62.5% bull, 31% bear, 6% stagnant market — matching the analytic values."
    - title: "Fitting a cosmic transient with emcee"
      lecture: "L11"
      url: "https://github.com/MatthewMaisano/Astrostatistics-Laboratory/blob/main/lectures/Executives/Emcee%20training%20%28L11%29.ipynb"
      img: "assets/img/astro-ai/emcee.png"
      tags: ["MCMC", "emcee"]
      what: "Modelled the light curve of a transient (a sudden burst followed by exponential decay) and sampled the 4 model parameters with the emcee MCMC sampler, checking convergence via autocorrelation times and acceptance fraction (0.54)."
      result: "The posterior pins down the background level (≈10.3), the burst time (≈50) and the decay rate (≈0.12), with full uncertainties and correlations (corner plot)."
    - title: "Model comparison with nested sampling"
      lecture: "L12"
      url: "https://github.com/MatthewMaisano/Astrostatistics-Laboratory/blob/main/lectures/Executives/Dynesty%20training%20%28L12%29.ipynb"
      img: "assets/img/astro-ai/dynesty.png"
      tags: ["Nested sampling", "Bayesian evidence"]
      what: "Re-analysed the same transient with the dynesty nested sampler and compared two hypotheses: a sharp burst with exponential decay vs a symmetric Gaussian bump."
      result: "The Bayesian evidence favours the burst model by a factor ≈ 235 — strong, quantitative evidence for one physical model over the other."
- name: "Unsupervised learning"
  description: "Finding structure in data without being told the answer."
  notebooks:
    - title: "Reading handwritten digits"
      lecture: "L13"
      url: "https://github.com/MatthewMaisano/Astrostatistics-Laboratory/blob/main/lectures/Executives/Reading%20numbers%20%28L13%29.ipynb"
      img: "assets/img/astro-ai/digits.png"
      tags: ["Classification", "Isomap"]
      what: "Trained a logistic-regression classifier on 1,797 images of handwritten digits (8×8 pixels), with and without first compressing them to 2 dimensions with Isomap."
      result: "96% accuracy on unseen digits using all 64 pixels; 72% after compressing to just 2 numbers per image — a clear view of the information lost by dimensionality reduction."
    - title: "Gamma-ray burst clustering"
      lecture: "L14"
      url: "https://github.com/MatthewMaisano/Astrostatistics-Laboratory/blob/main/lectures/Executives/Gamma%20ray%20bursts%20analysis%20%28L14%29.ipynb"
      img: "assets/img/astro-ai/grb.png"
      tags: ["Clustering", "Real catalogue"]
      what: "Downloaded the public catalogue of observed gamma-ray bursts and looked for groups in burst duration vs redshift with mean-shift and K-means clustering."
      result: "Mean-shift identifies two groups of bursts in the duration–redshift plane (exploratory analysis)."
    - title: "Classifying stars without labels"
      lecture: "L15"
      url: "https://github.com/MatthewMaisano/Astrostatistics-Laboratory/blob/main/lectures/Executives/Classification%20of%20stars%20%28L15%29.ipynb"
      img: "assets/img/astro-ai/stars.png"
      tags: ["PCA", "Clustering"]
      what: "Took 240 stars described by temperature, luminosity, radius and magnitude, standardised the data, compressed it with Principal Component Analysis and clustered it — without using the true star types."
      result: "Two components keep 98% of the information (76% in the first alone) and mean-shift finds 6 clusters — exactly the number of real star types (dwarfs, main sequence, giants…)."
    - title: "Clustering digits with t-SNE"
      lecture: "L16"
      url: "https://github.com/MatthewMaisano/Astrostatistics-Laboratory/blob/main/lectures/Executives/Clustering%20Digits%20in%20a%20cleaner%20way%20%28L16%20side%20exercise%29.ipynb"
      img: "assets/img/astro-ai/digits-tsne.png"
      tags: ["t-SNE", "K-means"]
      what: "Projected the 64-pixel digit images onto a 2D map with t-SNE and then let K-means group them, again without looking at the labels."
      result: "The ten digits separate into ten clean islands that K-means recovers almost perfectly."
- name: "Regression"
  description: "Fitting curves through data without over- or under-fitting."
  notebooks:
    - title: "Supernova Hubble diagram: polynomial regression"
      lecture: "L17"
      url: "https://github.com/MatthewMaisano/Astrostatistics-Laboratory/blob/main/lectures/Executives/Supernovas%20Plot%20%28L17%29.ipynb"
      img: "assets/img/astro-ai/supernova-poly.png"
      tags: ["Regression", "Cross-validation"]
      what: "Fitted the distance of 100 supernovae as a function of redshift with straight lines and polynomials of degree 1 to 8, comparing χ² and 10-fold cross-validation errors."
      result: "Cross-validation picks a degree-5 polynomial: higher degrees start chasing noise (overfitting), lower ones miss the curvature."
    - title: "Supernova distances with Gaussian Processes"
      lecture: "L18"
      url: "https://github.com/MatthewMaisano/Astrostatistics-Laboratory/blob/main/lectures/Executives/Supernova%20distances%20%26%20Redshift.ipynb"
      img: "assets/img/astro-ai/supernova-gp.png"
      tags: ["Gaussian Processes", "Cross-validation"]
      what: "Fitted the same supernova data with a non-parametric Gaussian Process, scanning the kernel length-scale and choosing it by cross-validation; started a cosmological fit with emcee."
      result: "Too short a length-scale overfits wildly, too long underfits; the cross-validated choice gives a smooth curve with uncertainty bands."
- name: "Supervised learning & neural networks"
  description: "Teaching algorithms to recognise classes of astrophysical objects."
  notebooks:
    - title: "Galaxies vs quasars from their colours"
      lecture: "L19"
      url: "https://github.com/MatthewMaisano/Astrostatistics-Laboratory/blob/main/lectures/Executives/Classification%20of%20galaxies%20and%20quasars%20%28L19%29.ipynb"
      img: "assets/img/astro-ai/galaxy-quasar.png"
      tags: ["Classification", "SDSS data"]
      what: "Used the colours (differences of u, g, r, i, z magnitudes) of 50,000 SDSS objects to separate galaxies from quasars with Quadratic Discriminant Analysis and a Gaussian-mixture Bayes classifier."
      result: "≈ 98% accuracy (cross-validated), recovering ~93% of quasars with only ~6–10% contamination."
    - title: "Which black-hole mergers will we detect?"
      lecture: "L20"
      url: "https://github.com/MatthewMaisano/Astrostatistics-Laboratory/blob/main/lectures/Executives/BH%20classification%20%28L20%29.ipynb"
      img: "assets/img/astro-ai/bh-classification.png"
      tags: ["t-SNE", "Decision trees"]
      what: "Took a large simulated catalogue of binary black-hole mergers and predicted whether a gravitational-wave detector would see each one (signal-to-noise > 12) from inclination, redshift and mass ratio, using t-SNE and bagged decision trees."
      result: "82.5% of detectable events are correctly identified, with 13% contamination."
    - title: "Neural network for gravitational-wave detectability"
      lecture: "L22"
      url: "https://github.com/MatthewMaisano/Astrostatistics-Laboratory/blob/main/lectures/Executives/Neural%20Network%20BH%20%28L22%29.ipynb"
      img: "assets/img/astro-ai/nn-loss.png"
      tags: ["Neural networks", "PyTorch"]
      what: "Built and trained from scratch a small neural network in PyTorch (3 inputs → 6 hidden neurons → 2 outputs) on the same black-hole problem, using stochastic gradient descent for 1,000 epochs."
      result: "93.75% accuracy on unseen events (750 / 800) — better than the decision-tree approach."
    - title: "The HiggsML challenge"
      lecture: "L22"
      url: "https://github.com/MatthewMaisano/Astrostatistics-Laboratory/blob/main/lectures/Executives/The%20HiggsML%20challenge%20%28L22%29.ipynb"
      img: ""
      tags: ["Particle physics", "Work in progress"]
      what: "Started exploring the 250,000 simulated collision events of the ATLAS Higgs Machine Learning challenge, where the goal is to separate Higgs-boson “signal” from background."
      result: "Data cleaning and first exploration done; classifier to come."
