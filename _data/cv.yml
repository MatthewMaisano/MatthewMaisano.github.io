    Projects:
      - name: "Master thesis: Black holes with homogeneous horizon in gauged supergravity"
        summary: >
          Finding solutions for 5D black holes with homogeneous horizon, with possible extensions to the 8 Thurston geometries. The work is mainly developed in 5D AdS and asymptotically AdS settings.
        highlights:
          - Extension of General Relativity
          - Einstein Equations
          - Coupled Differential Equations
          - Rotating and Charged Black Holes
        start_date: 2025
        end_date: 2026

      - name: "Astrophysics Data Analysis: numerical simulations in Python"
        summary: >
          Developed numerical models to study astrophysical systems and visualize results with scientific plots, including machine-learning-based techniques. Used Python tools for data analysis, validation, and interpretation of simulation outcomes.
        highlights:
          - Unsupervised and Supervised Learning
          - Neural Networks
        start_date: 2025
        end_date: 2025

      - name: "Harmonic Oscillator and Wilson Cluster: numerical simulations in C"
        summary: >
          Explored advanced C simulations of a quantum harmonic oscillator, with the goal of computing the mass and ground-state energy. Used the Wilson Cluster (Milano - Bicocca) to generate data for numerical computation of topological susceptibility in SU(3) Yang–Mills theory and the chiral anomaly.
        highlights:
          - Algorithm Efficiency Optimization
          - Markov Chain Monte Carlo
        start_date: 2025
        end_date: 2026
